[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ukrainian-mention-graph"
version = "0.1.0"
description = "Reproducible experiments for graph-based refinement of Ukrainian named-entity mention types."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "numpy>=2.0,<3",
  "torch>=2.10,<3",
  "transformers>=5.0,<6",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
download = ["huggingface_hub>=1.0,<2"]
morphology = [
  "pymorphy3==2.0.6",
  "pymorphy3-dicts-uk==2.4.1.1.1663094765",
]

[project.scripts]
mention-graph = "mention_graph.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
